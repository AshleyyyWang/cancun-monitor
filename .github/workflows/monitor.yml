name: Cancun Price Monitor

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"   # every 6 hrs: 8pm/2am/8am/2pm Toronto EDT
  workflow_dispatch:               # manual run from Actions tab

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write              # needed to commit status.json back to repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Write config.json from secrets
        run: |
          cat > config.json << ENDJSON
          {
            "gmail_address":        "${{ secrets.GMAIL_ADDRESS }}",
            "gmail_app_password":   "${{ secrets.GMAIL_APP_PASSWORD }}",
            "recipient_email":      "${{ secrets.RECIPIENT_EMAIL }}",
            "min_nights":           5,
            "max_nights":           7,
            "max_price_cad":        ${{ vars.MAX_PRICE_CAD || 1200 }},
            "monitor_months_ahead": ${{ vars.MONITOR_MONTHS || 3 }},
            "headless":             true,
            "request_timeout_ms":   30000,
            "notify_on_every_deal": false
          }
          ENDJSON

      - name: Restore deals history cache
        uses: actions/cache@v4
        with:
          path: data/
          key: deals-history-${{ github.run_id }}
          restore-keys: |
            deals-history-

      - name: Run price monitor
        run: python main.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit dashboard status.json to repo
        run: |
          git config user.name  "Cancun Monitor Bot"
          git config user.email "actions@github.com"
          git add docs/status.json || true
          git diff --staged --quiet || git commit -m "chore: update dashboard [skip ci]"
          git push
        continue-on-error: true   # don't fail the run if nothing changed

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-logs-${{ github.run_number }}
          path: logs/
          retention-days: 14
